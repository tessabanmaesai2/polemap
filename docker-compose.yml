version: '3.8'

services:
  polemap:
    build: .
    container_name: polemap
    restart: always
    ports:
      - "3406:3406"
    env_file:
      - .env
    environment:
      - PORT=3406
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
      - ./public:/app/public
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./manage.html:/app/manage.html
      - ./back.html:/app/back.html
      - ./server.cjs:/app/server.cjs
      - ./polemap_logo.png:/app/polemap_logo.png
